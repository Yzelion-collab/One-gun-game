(cl?`<path d="M${x-6} ${y} l4 5 l8-10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>`:`<text x="${x}" y="${y+5}" text-anchor="middle" font-size="11" font-weight="bold" fill="#1c2733">${n}</text>`)+
(n==S.clear+1?`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#fff" stroke-width="3"><animate attributeName="r" values="${r+2};${r+11};${r+2}" dur="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="1.3s" repeatCount="indefinite"/></circle>`:'')+

for(const[G,i]of L2){const o=S.guns.includes(i);r.push(`<div class=r><svg width="${G.mel?120:90}" height="36" viewBox="${G.mel?'-38 -20 170 44':'-36 -20 110 44'}">${G.s.map(p=>`<path d="${p[0]}" fill="${p[1]}" stroke="#0d1014" stroke-width="1.6" stroke-linejoin="round"/>`).join('')}</svg><b>${G.n}<br><i>dmg ${G.d} · ${G.mel?'melee · reach '+G.rg:'mag '+G.m} · ${G.p>1?G.p+' pellets':G.ex?'explosive':(1/G.r).toFixed(1)+'/s'}</i></b><button ${S.gun==i?'disabled':''} onclick="buyGun(${i})">${S.gun==i?'Equipped':o?'Equip':G.c+'g'}</button></div>`)}}
panel(`<h2>Armory</h2><p style="margin:0 0 4px">Gold: ${S.gold}</p><div class=tb>${TOPS.map((t,i)=>`<button style="opacity:${i==a?1:.55}" onclick="shopTab(${i},0)">${t[0]}</button>`).join('')}</div>`+(subs.length?`<div class=tb>${subs.map((n,i)=>`<button style="background:${i==b?'#9be36f':'#5a6b5a'}" onclick="shopTab(${a},${i})">${n}</button>`).join('')}</div>`:'')+`<p style="font-size:13px">${desc}</p>${r.join('')}<button onclick="bk()">Back</button>`,640)}
const PI=PETS.map((p,i)=>{const o=g;try{const c=document.createElement('canvas');c.width=150;c.height=100;const x=c.getContext('2d');g=x;x.translate(75,i==5?58:92);if(i==0||i==5)x.scale(2,2);petDraw(i,0,0,1,0);g=o;return c.toDataURL()}catch(e){g=o;return''}});
CX.unshift(['In Game',()=>'<p>Everything below with a check is unlocked. The other tabs are the full wishlist.</p>'+L('Weapons ('+GUNS.length+')',GUNS.map((G,i)=>G.n+(G.mel?' [melee]':'')+(S.guns.includes(i)?' ✓':'')).join(', '))+L('Companions ('+PETS.length+')',PETS.map((p,i)=>p.n+(S.pets.includes(i)?' ✓':'')+' - '+p.i).join(', '))+L('Bestiary ('+Object.keys(TY).length+')',Object.keys(TY).join(', '))+L('Bosses',BN.join(', '))+L('Biomes ('+BI.length+', 30 levels)',BI.map(b=>b.n).join(', '))]);
showMenu();requestAnimationFrame(loop);
