<style>
html,body{margin:0;height:100%;background:#0b0f12;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",sans-serif;color:#f4f4ff;-webkit-tap-highlight-color:transparent}
#w{position:fixed;left:0;top:0;width:100vw;height:100vh;transform-origin:0 0;display:flex;align-items:center;justify-content:center}
canvas{touch-action:none;user-select:none;background:#cfe8a0}

.cx{text-align:left;font-size:13px;line-height:1.45}.cx h3{margin:12px 0 4px;color:#ffb703;font-size:15px}.cx b{color:#9be36f}.cx ul{margin:4px 0;padding-left:18px}
.cx pre{background:#0d1512;border:1px solid #3a5a3a;border-radius:8px;padding:8px;font-size:11px;white-space:pre-wrap;margin:6px 0}

</style></head><body><div id="w"><canvas id="c" width="960" height="540"></canvas><div id="m"></div></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),M=document.getElementById('m'),W=960,H=540,GY=440;
const PL=[{x:120,y:335,w:200},{x:640,y:335,w:200},{x:380,y:235,w:200}];
const cS='#59616b',cD='#2b3037',cP='#3a4048',cW='#8a5a34',cB='#c9cdd3',cO='#5b6b45';
const GUNS=[
{n:'Pistol',d:16,r:.24,p:1,sp:.03,v:760,pi:0,c:0,m:15,rl:.9,s:[['M-6-9H27V-1H-6Z',cS],['M-6-1H15V3H9V7H5L3 17H-9Z',cP],['M-9 15H3V18H-9Z',cD],['M-5-11H-1V-9H-5ZM23-11H26V-9H23Z',cD],['M27-7H30V-3H27Z',cB]]},
{n:'SMG',d:6,r:.09,p:1,sp:.12,v:800,pi:0,c:400,m:40,rl:1.4,s:[['M-12-8H26V1H-12Z',cD],['M26-6H42V-1H26Z',cS],['M42-7H46V0H42Z',cB],['M-6-11H6V-8H-6ZM22-11H25V-8H22Z',cD],['M6 1H14L16 21H8Z',cP],['M-8 1H0L-3 15H-11Z',cP],['M-12-6H-26V-3H-12Z',cS]]},
{n:'Shotgun',d:7,r:.7,p:6,sp:.32,v:700,pi:0,c:900,m:6,rl:1.6,s:[['M2-6H50V-2H2Z',cS],['M4-2H44V2H4Z',cD],['M48-9H50V-6H48ZM50-7H54V-1H50Z',cB],['M-14-8H4V5H-14Z',cD],['M20 2H38V8H20Z',cW],['M-14-7L-34-3L-36 10L-14 5Z',cW],['M-8 5H-2V9H-8Z',cD]]},
{n:'Rifle',d:32,r:.5,p:1,sp:.01,v:1100,pi:2,c:1500,m:20,rl:1.3,s:[['M-12-8H14V3H-12Z',cD],['M14-6H36V2H14Z',cW],['M36-4H49V-1H36Z',cS],['M49-5H54V0H49Z',cB],['M-12-6H-30L-32 7H-12Z',cW],['M0 3H8L13 19H5Z',cP],['M-10 3H-4L-6 15H-13Z',cP],['M-6-14H16V-9H-6Z',cD],['M16-14H18V-9H16Z','#5aa9e6']]},
{n:'Minigun',d:4,r:.05,p:1,sp:.15,v:850,pi:0,c:2200,m:120,rl:2.2,s:[['M-10-10H14V8H-10Z',cD],['M14-9H50V-5H14ZM14-4H50V0H14ZM14 1H50V5H14Z',cS],['M28-10H32V7H28Z',cD],['M50-10H54V6H50Z',cB],['M-8 8H12V22H-8Z',cO],['M-20-8H-10V-3H-20ZM-4-14H8V-10H-4Z',cP],['M2 8H8L6 17H0Z',cP]]},
{n:'Rocket',d:60,r:.9,p:1,sp:.01,v:520,pi:0,c:3000,m:4,rl:2,ex:1,s:[['M-28-8H36V5H-28Z',cO],['M-8-8H-4V5H-8ZM18-8H22V5H18ZM-34-11H-28V8H-34Z',cD],['M36-10H48L54-2L48 6H36Z','#c0392b'],['M-4 5H4L1 17H-7ZM18 5H24L23 15H17Z',cP],['M6-14H14V-8H6Z',cD]]}];
GUNS.forEach(G=>G.pa=G.s.map(([d,c])=>[new Path2D(d),c]));
const SKL=[{n:'Grenade',c:10,k:'#c0392b'},{n:'Landmine',c:50,k:'#6f7f3a'},{n:'Squad',c:10,k:'#4b6584'}];
const TY={
grunt:{hp:26,sp:52,dm:6,s:1,c:'#5fbf4a',xp:1},
runner:{hp:16,sp:105,dm:5,s:.85,c:'#ff8a3d',xp:1},
brute:{hp:110,sp:40,dm:13,s:1.6,c:'#6f8fb3',xp:3},
bat:{hp:16,sp:80,dm:5,s:.7,c:'#3dd6c6',xp:1},
boss:{hp:600,sp:45,dm:18,s:3.2,c:'#4c6f9c',xp:12}};
const SK=[
['Double shot','+1 bullet per shot',p=>p.sk.multi++],
['Rapid fire','+25% fire rate',p=>p.sk.rate++],
['Heavy rounds','+30% damage',p=>p.sk.pow++],
['Piercing','Bullets pass through one more enemy',p=>p.sk.pierce++],
['Swift boots','+15% move speed',p=>p.sk.speed++],
['Coin magnet','Bigger pickup range',p=>p.sk.mag++],
['Mana surge','+40 max MP, refill MP',p=>{p.mm+=40;p.mp=p.mm}],
['Vitality','+30 max HP and heal 30',p=>{p.mh+=30;p.hp=Math.min(p.mh,p.hp+30)}],
['Medkit','Restore 60% HP',p=>p.hp=Math.min(p.mh,p.hp+p.mh*.6)]];
let S={gold:0,atk:0,arm:0,hp:0,guns:[0],gun:0,cat:0,clear:0,best:0,sp:0,tk:[],lk:0,dt:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('ogs')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('ogs',JSON.stringify(S))}catch(e){}};
let st='menu',P,run,E=[],B=[],EB=[],PT=[],C=[],T=[],AL=[],MN=[],shake=0;const K={},HD={};
const SKY=g.createLinearGradient(0,0,0,GY);SKY.addColorStop(0,'#f7f1a8');SKY.addColorStop(1,'#bfe38c');
const BT=[
{id:'L',x:6,y:456,w:124,h:82},{id:'R',x:150,y:456,w:124,h:82},{id:'U',x:80,y:366,w:120,h:82},
{id:'s0',x:W/2-136,y:446,w:64,h:64},{id:'s1',x:W/2-32,y:446,w:64,h:64},{id:'s2',x:W/2+72,y:446,w:64,h:64},
{id:'rl',x:W-100,y:300,w:66,h:66},{id:'dg',x:W-100,y:376,w:66,h:66},{id:'wl',x:84,y:14,w:30,h:44},{id:'wr',x:186,y:14,w:30,h:44},
{id:'bag',x:14,y:14,w:60,h:60},{id:'pz',x:W-74,y:14,w:60,h:60}];
const held=id=>Object.values(HD).includes(id);
const kd={L:['a','arrowleft'],R:['d','arrowright'],U:['w','arrowup',' ']},pr=id=>held(id)||(kd[id]||[]).some(k=>K[k]);
const cyOf=e=>e.t=='bat'?e.y:e.y-16*TY[e.t].s;

/* audio */
let ac;function snd(f,d,ty='square',v=.06){try{ac=ac||new AudioContext();const o=ac.createOscillator(),n=ac.createGain(),t=ac.currentTime;
o.type=ty;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f/2),t+d);
n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n);n.connect(ac.destination);o.start();o.stop(t+d)}catch(e){}}

/* menus */
function panel(h,w){M.innerHTML='<div class=p'+(w?' style="max-width:'+w+'px;width:92%"':'')+'>'+h+'</div>';M.style.display='flex'}
function hide(){M.style.display='none'}
const bk=()=>st=='pause'?pause():showMenu();
function showMenu(){st='menu';panel(`<h1>ONE GUN</h1><p>Stick Warrior · ${S.gold} gold · best endless ${S.best} kills</p>
<button onclick="showMap()">Campaign</button><button onclick="start(1,1)">Endless</button><button onclick="showShop()">Shop</button><button onclick="showSkills()">Skills ${S.sp|0}</button><button onclick="showCodex(0)">Codex</button>
<p style="font-size:13px">Auto-aim & auto-fire. Touch: on-screen pad and buttons.<br>Keys: A/D move · W jump (twice) · 1-3 skills · R reload · Q/E swap gun · P pause</p>`)}
function showMap(){let z=7;const rn=()=>(z=(z*9301+49297)%233280)/233280,N=Array.from({length:20},(_,i)=>[64+i*31.8,182+Math.sin(i*.75+.3)*98]);
let v='<defs><clipPath id="c"><rect x="10" y="10" width="700" height="340" rx="34"/></clipPath></defs><g clip-path="url(#c)">';
BI.forEach((q,k)=>{v+=`<rect x="${10+k*175}" y="10" width="176" height="340" fill="${q.map}"/><text x="${98+k*175}" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2733" opacity=".7">${q.n}</text>`;
for(let j=0;j<8;j++){const x=22+k*175+rn()*152,y=30+rn()*270;v+=[`<circle cx="${x}" cy="${y}" r="11" fill="#2f7d32"/><rect x="${x-2}" y="${y+9}" width="4" height="7" fill="#5a3b1e"/>`,`<rect x="${x-3}" y="${y-13}" width="6" height="26" rx="3" fill="#4f8a3a"/><rect x="${x-9}" y="${y-4}" width="6" height="4" fill="#4f8a3a"/>`,`<polygon points="${x},${y-17} ${x-10},${y+9} ${x+10},${y+9}" fill="#2e6b5a"/><polygon points="${x},${y-17} ${x-4},${y-8} ${x+4},${y-8}" fill="#fff"/>`,`<polygon points="${x-15},${y+11} ${x-5},${y-13} ${x+5},${y-13} ${x+15},${y+11}" fill="#3a2620"/><polygon points="${x-5},${y-13} ${x+5},${y-13} ${x+2},${y-6} ${x-2},${y-6}" fill="#ff7b3a"/>`][k]}});
const pts=N.map(p=>p.join(',')).join(' ');
v+=`<polyline points="${pts}" fill="none" stroke="#f0dfb0" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${pts}" fill="none" stroke="#8a6d3b" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round"/></g>`;
N.forEach(([x,y],i)=>{const n=i+1,ok=n<=S.clear+1,cl=S.clear>=n,bs=n%5==0,r=bs?21:15;
v+=`<g${ok?` onclick="start(0,${n})" style="cursor:pointer"`:''}><circle cx="${x}" cy="${y+3}" r="${r+3}" fill="#0005"/><circle cx="${x}" cy="${y}" r="${r}" fill="${cl?'#4cc23a':ok?'#ffb703':'#8a8f97'}" stroke="${bs?'#c0392b':'#1c2733'}" stroke-width="${bs?4:3}"/>`+
(cl?`<path d="M${x-6} ${y} l4 5 l8-10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>`:`<text x="${x}" y="${y+5}" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2733">${n}</text>`)+
(n==S.clear+1?`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#fff" stroke-width="3"><animate attributeName="r" values="${r+2};${r+11};${r+2}" dur="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="1.3s" repeatCount="indefinite"/></circle>`:'')+
(bs?`<text x="${x}" y="${y+r+13}" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff" stroke="#000" stroke-width="2.5" paint-order="stroke">BOSS</text>`:'')+'</g>'});
panel(`<h2>Conquer the map</h2><svg viewBox="0 0 720 360" style="width:100%;display:block;margin:6px 0 10px;border-radius:24px">${v}</svg><button onclick="showMenu()">Back</button>`,780)}
function showShop(){const r=[];
const up=(k,n,d)=>{const c=Math.floor(60*Math.pow(1.55,S[k])),x=k=='arm'&&S.arm>=10;r.push(`<div class=r><b>${n} Lv ${S[k]}</b><i>${d}</i><button ${x?'disabled':''} onclick="buyUp('${k}',${c})">${x?'Max':c+'g'}</button></div>`)};
up('atk','Attack','+15% damage');up('arm','Armor','-6% damage taken');up('hp','Health','+20 max HP');
GUNS.forEach((G,i)=>{const o=S.guns.includes(i);r.push(`<div class=r><svg width="76" height="34" viewBox="-38 -17 96 42">${G.s.map(p=>`<path d="${p[0]}" fill="${p[1]}" stroke="#0d1014" stroke-width="1.6" stroke-linejoin="round"/>`).join('')}</svg><b>${G.n}<br><i>dmg ${G.d} · mag ${G.m} · ${G.p>1?G.p+' pellets':G.ex?'explosive':(1/G.r).toFixed(1)+'/s'}</i></b><button ${S.gun==i?'disabled':''} onclick="buyGun(${i})">${S.gun==i?'Equipped':o?'Equip':G.c+'g'}</button></div>`)});
r.push(`<div class=r><b>Penguin pet</b><i>Waddles along and shoots</i><button ${S.cat?'disabled':''} onclick="buyCat()">${S.cat?'Hired':'500g'}</button></div>`);
panel(`<h2>Armory</h2><p>Gold: ${S.gold}</p>${r.join('')}<button onclick="bk()">Back</button>`)}
function buyUp(k,c){if(S.gold>=c){S.gold-=c;S[k]++;save()}showShop()}
function buyGun(i){if(S.guns.includes(i))S.gun=i;else if(S.gold>=GUNS[i].c){S.gold-=GUNS[i].c;S.guns.push(i);S.gun=i}save();showShop()}
function buyCat(){if(S.gold>=500){S.gold-=500;S.cat=1;save()}showShop()}
function pause(){st='pause';panel('<h2>Paused</h2><button onclick="resume()">Resume</button><button onclick="showShop()">Armory</button><button onclick="showMenu()">Quit run</button>')}
function resume(){st='play';hide()}
function lvlUp(){P.xp-=P.nx;P.nx=Math.floor(P.nx*1.45)+2;P.lv++;run.pick=[...SK].sort(()=>Math.random()-.5).slice(0,3);st='pick';
panel('<h2>Level '+P.lv+'! Pick a skill</h2>'+run.pick.map((s,i)=>`<div class=r><b>${s[0]}</b><i>${s[1]}</i><button onclick="choose(${i})">${i+1}</button></div>`).join(''))}
function choose(i){run.pick[i][2](P);snd(700,.15,'sine');st='play';hide()}
function over(w){st='over';const en=run.mode==1,bonus=w?50+run.lv*30:0;S.gold+=run.gold+bonus;
if(en)S.best=Math.max(S.best,run.kills);let sp=0;if(w&&!en&&run.lv>S.clear){S.sp++;sp=1}if(w)S.clear=Math.max(S.clear,run.lv);S.lk+=run.kills;if(!w)S.dt++;save();
panel(`<h2>${w?'Level '+run.lv+' conquered!':en?'You fell':'Defeated'}</h2><p>Kills ${run.kills} · Gold +${run.gold+bonus}${en?' · Best '+S.best:''}${w&&!en?(sp?' · +1 Skill Point (first clear)':' · replay: 0 SP'):''}</p>`+
(w&&run.lv<20?`<button onclick="start(0,${run.lv+1})">Next level</button>`:`<button onclick="start(${run.mode},${run.lv})">Retry</button>`)+
`<button onclick="showShop()">Shop</button><button onclick="showSkills()">Skills</button><button onclick="showMenu()">Menu</button>`)}

/* game logic */
function start(mode,lv){const mh=150+S.hp*20+(hs('d1')?25:0),G=GUNS[S.gun];
P={x:W/2,y:GY,vx:0,vy:0,f:1,hp:mh,mh,mp:100,mm:100,jumps:0,cd:0,inv:0,xp:0,nx:5,lv:1,t:0,ang:0,mv:0,on:true,tg:null,gn:S.gun,ammo:G.m,rl:0,fl:0,sk:{multi:0,rate:0,pow:0,pierce:0,speed:0,mag:0},sw:0,nh:9,rc:8,ro:0,rd:1};
E=[];B=[];EB=[];PT=[];C=[];T=[];MN=[];AL=S.cat?[{pet:1,x:P.x,y:GY,l:1e9,cd:0,r:.6,d:8*(1+S.atk*.15),c:'#bfefff'}]:[];
run={mode,lv,kills:0,gold:0,spawned:0,total:8+lv*5,sp:1,time:0,d:1,ban:2,bt:mode?'ENDLESS':'LEVEL '+lv+' · '+BI[((lv-1)/5|0)%4].n};st='play';hide()}
function pop(x,y,c,n,s){for(let i=0;i<n;i++){const a=Math.random()*6.3,v=Math.random()*s;PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,l:.4+Math.random()*.4,c})}}
function spawn(){const l=run.lv,r=Math.random(),last=run.mode==0&&run.spawned==run.total-1&&l%5==0;
let t=last?'boss':r<.45?'grunt':r<.68?'runner':r<.86?'bat':'brute';if(t=='brute'&&run.d<1.5)t='grunt';
const gold=t!='boss'&&Math.random()<(run.mode?.12:.06),hp=Math.ceil(TY[t].hp*run.d*(gold?1.5:1));
E.push({t,x:Math.random()<.5?-40:W+40,y:t=='bat'?120+Math.random()*130:GY,hp,mh:hp,f:1,hit:0,t2:Math.random()*6,cd:1.5,g:gold});run.spawned++;if(t=='boss'){run.ban=2.5;run.bt='BOSS INCOMING!'}}
function shoot(){const G=GUNS[S.gun],n=G.p+P.sk.multi,dm=G.d*(1+S.atk*.15)*(1+P.sk.pow*.3)*(hs('o4')?1.2:1);
const ox=P.x+Math.cos(P.ang)*54,oy=P.y-40+Math.sin(P.ang)*54;
for(let i=0;i<n;i++){const a=P.ang+(Math.random()-.5)*G.sp*2+(n>1&&G.p==1?(i-(n-1)/2)*.12:0);
B.push({x:ox,y:oy,vx:Math.cos(a)*G.v,vy:Math.sin(a)*G.v,dm,pi:G.pi+P.sk.pierce,h:[],l:1.5,gr:G.ex})}
P.ammo--;P.fl=.07;P.cd=G.r/(1+P.sk.rate*.25);P.vx-=Math.cos(P.ang)*(G.p>1||G.ex?90:20)*(hs('o1')?.85:1);shake=Math.max(shake,(G.p>1||G.ex?4:1.5)*(hs('o1')?.85:1));
pop(ox,oy,'#ffe27a',3,150);if(!G.ex)PT.push({x:P.x,y:P.y-38,vx:-P.f*(60+Math.random()*60),vy:-160-Math.random()*80,l:.7,c:'#e0b040'});snd(G.ex?70:G.p>1?90:220,.07,'square',.07)}
function reload(){const G=GUNS[S.gun];if(P.rl<=0&&P.ammo<G.m)P.rl=G.rl}
function jump(){if(P.jumps<2){P.vy=-680;P.jumps++;snd(400,.08,'sine',.05)}}
function swap(d){const o=S.guns;S.gun=o[(o.indexOf(S.gun)+d+o.length)%o.length]}
function skill(i){const k=SKL[i];if(P.mp<k.c)return;P.mp-=k.c;const m=(1+S.atk*.15)*(1+P.sk.pow*.3),t=P.tg;snd(150,.2,'sawtooth',.08);
if(i==0){const a=t?Math.atan2(cyOf(t)-(P.y-40)-60,t.x-P.x):(P.f>0?-.6:Math.PI+.6);B.push({x:P.x,y:P.y-40,vx:Math.cos(a)*520,vy:Math.sin(a)*520-150,dm:70*m,pi:0,h:[],l:3,gr:1,gv:1})}
else if(i==1){for(const d of[-90,90])MN.push({x:Math.max(30,Math.min(W-30,P.x+d)),t:0,dm:110*m});while(MN.length>6)MN.shift()}
else for(let j=-1;j<2;j++)AL.push({x:P.x+j*36,y:GY,l:8,cd:.2+j*.1,r:.5,d:6*m,c:'#9ad'})}
function tap(id){if(st!='play')return;
if(id=='U')jump();else if(id[0]=='s')skill(+id[1]);else if(id=='rl')reload();else if(id=='dg')roll();
else if(id=='wl'||id=='wr')swap(id=='wr'?1:-1);else if(id=='bag'||id=='pz')pause()}
function assist(a,h){let n=null,bd=1e9;for(const e of E){const d=Math.abs(e.x-a.x);if(d<bd){bd=d;n=e}}if(!n)return;
const oy=a.y-h,r=Math.atan2(cyOf(n)-oy,n.x-a.x);B.push({x:a.x,y:oy,vx:Math.cos(r)*800,vy:Math.sin(r)*800,dm:a.d*(hs('c2')?1.3:1),pi:0,h:[],l:1.2,c:a.c});a.cd=a.r/(hs('c1')?1.2:1);snd(600,.05,'triangle',.03)}
function boom(b){snd(60,.4,'sawtooth',.15);shake=12;pop(b.x,b.y,'#ff9f1c',30,320);
for(const e of E)if(Math.hypot(e.x-b.x,cyOf(e)-b.y)<110){e.hp-=b.dm;e.hit=.15;T.push({x:e.x,y:cyOf(e)-30,s:b.dm|0,l:.6,r:0})}}

function update(dt){
run.time+=dt;run.ban-=dt;P.t+=dt;P.fl-=dt;P.cd-=dt;P.inv-=dt;const en=run.mode==1,G=GUNS[S.gun];run.d=en?1+run.time/80:1+run.lv*.1;
if(P.gn!=S.gun){P.gn=S.gun;P.ammo=G.m;P.rl=0}
P.mp=Math.min(P.mm,P.mp+6*dt);P.hp=Math.min(P.mh,P.hp+2*dt);
const mv=(K.d||K.arrowright||held('R')?1:0)-(K.a||K.arrowleft||held('L')?1:0),spd=230*(1+P.sk.speed*.15);
P.vx+=(mv*spd-P.vx)*Math.min(1,dt*10);if(P.ro>0){P.ro-=dt;P.vx=P.rd*520}P.vy+=1900*dt;P.x+=P.vx*dt;P.y+=P.vy*dt;P.mv=Math.abs(mv);
let on=false;
if(P.y>=GY){P.y=GY;P.vy=0;on=true}
else if(P.vy>=0)for(const p of PL)if(P.x>p.x&&P.x<p.x+p.w&&P.y>=p.y&&P.y-P.vy*dt<=p.y+2){P.y=p.y;P.vy=0;on=true}
P.on=on;if(on)P.jumps=0;P.x=Math.max(15,Math.min(W-15,P.x));
let tg=null,bd=620;for(const e of E){const d=Math.hypot(e.x-P.x,cyOf(e)-(P.y-40));if(d<bd){bd=d;tg=e}}
P.tg=tg;if(tg){P.ang=Math.atan2(cyOf(tg)-(P.y-40),tg.x-P.x);P.f=Math.cos(P.ang)>=0?1:-1}else{if(mv)P.f=mv;P.ang=P.f>0?0:Math.PI}
if(P.rl>0){P.rl-=dt*(hs('o3')?1.25:1);if(P.rl<=0)P.ammo=G.m}else if(P.ammo<=0)P.rl=G.rl;else if(tg&&P.cd<=0)shoot();
run.sp-=dt;
if(run.sp<=0&&(en||run.spawned<run.total)&&E.length<(en?10:7)){spawn();run.sp=en?Math.max(.5,1.8-run.time/200):Math.max(.7,1.8-run.lv*.04)}
for(const e of E){const y=TY[e.t],dx=P.x-e.x;e.f=dx>0?1:-1;e.hit-=dt;e.t2+=dt;if(e.bl>0){e.bl-=dt;e.hp-=4*dt}if(e.st>0){e.st-=dt;continue}
if(e.t=='bat'){e.x+=e.f*y.sp*dt;e.y+=(P.y-45+Math.sin(e.t2*3)*70-e.y)*dt*1.4}
else e.x+=e.f*y.sp*dt*(e.t=='boss'&&e.cd<.5?3:1);
if(e.t=='boss'){e.cd-=dt;if(e.cd<=0){e.cd=2.2;const a0=Math.atan2(P.y-40-cyOf(e),dx);
for(let i=-1;i<2;i++)EB.push({x:e.x,y:cyOf(e),vx:Math.cos(a0+i*.25)*300,vy:Math.sin(a0+i*.25)*300,l:4})}}
if(Math.hypot(P.x-e.x,P.y-28-cyOf(e))<16+13*y.s)hurt(y.dm*(1+run.d*.05),e.f)}
for(const b of B){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(b.gv)b.vy+=900*dt;
if(b.x<-20||b.x>W+20||b.y<-20)b.l=0;
if(b.y>=GY){if(b.gr&&b.l>0)boom(b);b.l=0}
for(const e of E){if(b.l<=0)break;if(e.hp<=0||b.h.includes(e))continue;const y=TY[e.t];
if(Math.hypot(b.x-e.x,b.y-cyOf(e))<18+12*y.s){if(b.gr){boom(b);b.l=0;break}
b.h.push(e);e.hp-=b.dm*(e.st>0&&hs('c4')?1.5:1);e.hit=.1;if(hs('o2'))e.bl=3;e.x+=Math.sign(b.vx)*6;pop(b.x,b.y,y.c,4,120);
T.push({x:e.x,y:cyOf(e)-30,s:b.dm|0,l:.5,r:0});snd(300,.04,'triangle',.04);if(b.pi--<=0)b.l=0}}}
for(const e of E)if(e.hp<=0&&!e.dead){e.dead=1;kill(e)}
E=E.filter(e=>!e.dead);B=B.filter(b=>b.l>0);
for(const b of EB){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(Math.hypot(b.x-P.x,b.y-(P.y-28))<14){hurt(12*Math.sqrt(run.d),b.vx>0?1:-1);b.l=0}}
EB=EB.filter(b=>b.l>0&&b.y<GY);
for(const c of C){c.vy+=1500*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.vx*=.98;if(c.y>GY-4){c.y=GY-4;c.vy*=-.4;c.vx*=.8}
const d=Math.hypot(P.x-c.x,P.y-28-c.y);if(d<60+P.sk.mag*70){c.x+=(P.x-c.x)*dt*6;c.y+=(P.y-28-c.y)*dt*6}
if(d<18){run.gold+=c.v;c.d=1;snd(900,.05,'sine',.05)}}
C=C.filter(c=>!c.d);
for(const a of AL){a.l-=dt;a.cd-=dt;if(a.pet)a.x+=(P.x-P.f*44-a.x)*dt*3;if(a.cd<=0&&E.length)assist(a,a.pet?14:26)}
AL=AL.filter(a=>a.l>0);P.nh+=dt;P.sw-=dt;if(hs('d4')&&P.nh>4)P.hp=Math.min(P.mh,P.hp+6*dt);
if(hs('c3')&&S.cat){P.rc-=dt;if(P.rc<=0){P.rc=15;snd(90,.5,'sawtooth',.12);shake=10;for(const e of E)if(Math.abs(e.x-P.x)<300)e.st=3;T.push({x:P.x,y:P.y-70,s:'ROAR!',l:1,r:0})}}
for(const m of MN){m.t+=dt;if(m.t>.6)for(const e of E)if(e.t!='bat'&&Math.abs(e.x-m.x)<14+14*TY[e.t].s){boom({x:m.x,y:GY-10,dm:m.dm});m.d=1;break}}MN=MN.filter(m=>!m.d);
for(const p of PT){p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}PT=PT.filter(p=>p.l>0);
for(const t of T){t.y-=40*dt;t.l-=dt}T=T.filter(t=>t.l>0);
if(P.hp<=0){if(hs('d3')&&P.sw<=0){P.hp=P.mh*.3;P.sw=120;P.inv=2;T.push({x:P.x,y:P.y-70,s:'SECOND WIND',l:1,r:0})}else return over(false)}
if(!en&&run.spawned>=run.total&&!E.length)over(true)}

function bt(e){const iw=innerWidth,ih=innerHeight,por=ih>iw,rw=por?ih:iw,rh=por?iw:ih,c=Math.min(rw/W,rh/H),lx=por?e.clientY:e.clientX,ly=por?iw-e.clientX:e.clientY,x=(lx-(rw-W*c)/2)/c,y=(ly-(rh-H*c)/2)/c;return BT.find(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)}
cv.addEventListener('pointerdown',e=>{const b=bt(e);if(b){HD[e.pointerId]=b.id;tap(b.id)}e.preventDefault()});
addEventListener('pointermove',e=>{if(e.pointerId in HD){const b=bt(e),o=HD[e.pointerId];HD[e.pointerId]=b?b.id:'';if(b&&b.id=='U'&&o!='U')tap('U')}});
addEventListener('pointerup',e=>{delete HD[e.pointerId]});addEventListener('pointercancel',e=>{delete HD[e.pointerId]});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{const k=e.key.toLowerCase();K[k]=1;
if(st=='play'&&!e.repeat){if(k=='w'||k=='arrowup'||k==' ')jump();else if(k.length==1&&'123'.includes(k))skill(+k-1);else if(k=='r')reload();else if(k=='shift'||k=='x')roll();else if(k=='q'||k=='e')swap(k=='e'?1:-1);else if(k=='escape'||k=='p')pause()}
else if(st=='pause'&&(k=='escape'||k=='p'))resume();
else if(st=='pick'&&k.length==1&&'123'.includes(k)&&run.pick[+k-1])choose(+k-1);
if(k==' '||k.startsWith('arrow'))e.preventDefault()});
addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
addEventListener('visibilitychange',()=>{if(document.hidden&&st=='play')pause()});
const WR=document.getElementById('w');
function fit(){const iw=innerWidth,ih=innerHeight,por=ih>iw,rw=por?ih:iw,rh=por?iw:ih,c=Math.min(rw/W,rh/H);
WR.style.width=rw+'px';WR.style.height=rh+'px';WR.style.transform=por?`translate(${iw}px,0) rotate(90deg)`:'none';cv.style.width=W*c+'px';cv.style.height=H*c+'px'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,150));fit();
addEventListener('pointerdown',()=>{try{document.documentElement.requestFullscreen().then(()=>screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}},{once:true});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
showMenu();requestAnimationFrame(loop);
